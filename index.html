<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>UnicornKits</title>
    <meta name="description" content="UnicornKits — диски на авто" />
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <p class="notice">
        Это Telegram Mini App. В браузере витрина открывается, заказ уходит только
        из бота.
      </p>

      <header class="topbar">
        <div class="brand">
          <div class="mark">UK</div>
          <div>
            <h1>UnicornKits</h1>
            <p>диски на авто</p>
          </div>
        </div>
      </header>

      <div class="section-title">
        <h3>Каталог</h3>
        <span>8 моделей</span>
      </div>

      <div id="grid" class="grid"></div>
    </div>

    <div id="sheet" class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-card">
        <div id="sheetPhoto" class="sheet-photo empty">фото скоро</div>
        <h2 id="sheetTitle">Диск</h2>
        <p id="sheetNote"></p>
        <div class="actions">
          <button id="orderBtn" class="primary" type="button">Заказать</button>
          <button id="closeBtn" class="ghost" type="button">Закрыть</button>
        </div>
      </div>
    </div>

    <script src="js/catalog.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
